# Ishlab chiqarish uchun: PostgreSQL + YukGo
#   cp .env.example .env   (qiymatlarni to'ldiring)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: yukgo
      POSTGRES_USER: yukgo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yukgo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukgo"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/yukgo
      DB_USER: yukgo
      DB_PASSWORD: ${DB_PASSWORD:-yukgo}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
